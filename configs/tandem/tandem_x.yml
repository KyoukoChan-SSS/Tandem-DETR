# Tandem-DETR-XL: HGNetv2-B5 backbone, D-FINE-X widths (encoder 384, decoder 256).
# VisDrone val 800: AP 41.3 / AP50 63.9 / AP75 44.1 (79.05 M params).

__include__: [
  '../dataset/visdrone_detection.yml',
  '../runtime.yml',
  './include/tandem.yml',
]

output_dir: ./output/tandem_x

HGNetv2_Stem:
  name: 'B5'

TandemEncoder:
  in_channels: [384, 128, 512, 1024, 2048]  # [stem_proj, P2, P3, P4, P5]
  hidden_dim: 384
  dim_feedforward: 2048
  depth_mult: 1.0

TandemTransformer:
  feat_channels: [384, 384, 384, 384, 384]
  hidden_dim: 256                           # input_proj maps 384 -> 256, as D-FINE-X
  num_layers: 6
  reg_scale: 8

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.00000375
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.00000375
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder|stem_proj))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.
  lr: 0.0005
  betas: [0.9, 0.999]
  weight_decay: 0.00008125

train_dataloader:
  total_batch_size: 3
  num_workers: 10

val_dataloader:
  num_workers: 10
