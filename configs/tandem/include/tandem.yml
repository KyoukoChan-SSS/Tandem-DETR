# Shared TandemDETR recipe (all sizes): 800x800, 200 epochs, strong aug
# (Mosaic + MixUp) switched off at epoch 176, EMA on, AMP off.
# Size-specific files set backbone / encoder / decoder dims, optimizer and
# batch size.

model: TandemDETR
criterion: TandemCriterion
postprocessor: TandemPostProcessor
use_focal_loss: True
eval_spatial_size: [800, 800]   # h w

TandemDETR:
  backbone: HGNetv2_Stem
  encoder: TandemEncoder
  decoder: TandemTransformer

HGNetv2_Stem:
  return_idx: [0, 1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  pretrained: True
  local_model_dir: weight/hgnetv2/

TandemTransformer:
  feat_strides: [4, 4, 8, 16, 32]
  num_levels: 5
  num_points: [4, 4, 4, 4, 4]
  eval_idx: -1
  num_queries: 300
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  reg_max: 32
  layer_scale: 1
  cross_attn_method: default
  query_select_method: default

TandemPostProcessor:
  num_top_queries: 350

TandemCriterion:
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5}
  losses: ['vfl', 'boxes', 'local']
  alpha: 0.75
  gamma: 2.0
  reg_max: 32
  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 2.0

epochs: 200
clip_max_norm: 0.1

lr_scheduler:
  type: MultiStepLR
  milestones: [120, 150]
  gamma: 0.8

lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 500

train_dataloader:
  dataset:
    transforms:
      ops:
        - {type: Mosaic2, size: [800, 800], p: 1.0}
        - {type: MixUp, alpha: 1.5, p: 0.2}
        - {type: RandomPhotometricDistort, p: 0.8}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [800, 800]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        name: stop_epoch
        epoch: 176
        ops: ['Mosaic2', 'MixUp', 'RandomPhotometricDistort', 'RandomZoomOut', 'RandomIoUCrop']
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 800
    base_size_repeat: 6
    stop_epoch: 176
    ema_restart_decay: 0.9999
  shuffle: True

val_dataloader:
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [800, 800]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
  shuffle: False
  total_batch_size: 8
