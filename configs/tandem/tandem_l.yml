# Tandem-DETR-L: HGNetv2-B4 backbone, D-FINE-L widths.
# VisDrone val 800: AP 40.4 / AP50 63.0 / AP75 42.9 (38.55 M params).

__include__: [
  '../dataset/visdrone_detection.yml',
  '../runtime.yml',
  './include/tandem.yml',
]

output_dir: ./output/tandem_l

HGNetv2_Stem:
  name: 'B4'

TandemEncoder:
  in_channels: [256, 128, 512, 1024, 2048]  # [stem_proj, P2, P3, P4, P5]
  hidden_dim: 256
  dim_feedforward: 1024
  depth_mult: 1.0

TandemTransformer:
  feat_channels: [256, 256, 256, 256, 256]
  hidden_dim: 256
  num_layers: 6
  reg_scale: 4

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.00001875
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.00001875
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder|stem_proj))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.
  lr: 0.0005
  betas: [0.9, 0.999]
  weight_decay: 0.00008125

train_dataloader:
  total_batch_size: 4
  num_workers: 10

val_dataloader:
  num_workers: 10
